name: Sync submodule pointers

on:
  repository_dispatch:
    types: [submodule-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-submodule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout superproject
        uses: actions/checkout@v4

      - name: Sync all main-tracking submodules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # branch = main in .gitmodules is the allowlist: pinned homework
          # submodules have no branch entry and are never touched.
          MODULES=$(git config -f .gitmodules --get-regexp '\.branch$' \
            | awk '$2 == "main" { sub(/^submodule\./, "", $1); sub(/\.branch$/, "", $1); print $1 }')
          # The whole sweep retries from a fresh origin/main, so a push lost
          # to a concurrent run self-heals instead of failing.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            BUMPED=""
            for M in $MODULES; do
              URL=$(git config -f .gitmodules submodule."$M".url)
              NEW=$(git ls-remote "$URL" refs/heads/main | cut -f1)
              CURRENT=$(git ls-tree HEAD "$M" | awk '{print $3}')
              if [ -n "$NEW" ] && [ "$CURRENT" != "$NEW" ]; then
                git update-index --cacheinfo 160000,"$NEW","$M"
                BUMPED="$BUMPED $M"
                echo "bump $M -> ${NEW:0:7}"
              fi
            done
            if [ -z "$BUMPED" ]; then
              echo "Already up to date."
              exit 0
            fi
            git commit -m "chore: sync$BUMPED"
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (concurrent update), retrying..."
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
